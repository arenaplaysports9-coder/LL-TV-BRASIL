services:
  - type: web
    name: lltv-brasil-placar-pro
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
    disk:
      name: lltv-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
