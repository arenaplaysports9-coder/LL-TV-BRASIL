<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gerador de artes — LLTV BRASIL</title><style>body{margin:0;background:#111;color:#fff;font-family:Arial}.head{padding:18px;background:#050505;border-bottom:2px solid #d7ad4b;display:flex;justify-content:space-between;flex-wrap:wrap}.head h1{margin:0;color:#d7ad4b}.wrap{max-width:1200px;margin:auto;padding:20px}.panel{background:#1c1c1c;border:1px solid #444;border-radius:10px;padding:16px;margin-bottom:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.controls label{display:block}.controls input,.controls select{box-sizing:border-box;width:100%;padding:10px;margin-top:5px;background:#111;color:#fff;border:1px solid #555;border-radius:5px}.btn{background:#d7ad4b;color:#111;border:0;border-radius:5px;padding:10px 14px;font-weight:bold;cursor:pointer;margin:8px 5px 0 0}canvas{width:100%;height:auto;display:block;background:#222;border:1px solid #555}.note{color:#e5c46e}</style></head><body><header class="head"><div><h1>Gerador de artes esportivas</h1><div>LLTV BRASIL — A Casa das Ligas Alternativas</div></div><a style="color:#e5c46e" href="/modules.html">Gerenciamento de módulos</a></header><main class="wrap"><section class="panel"><h2>Configurar arte</h2><div class="controls"><label>Modelo<select id="template"><option value="pregame">Pré-jogo</option><option value="lineup">Escalação</option><option value="goal">Gol</option><option value="substitution">Substituição</option><option value="halftime">Intervalo</option><option value="final">Resultado final</option><option value="stats">Estatísticas</option><option value="next">Próxima partida</option><option value="star">Craque da partida</option></select></label><label>Formato<select id="format"><option value="1920,1080">1920 × 1080 — Horizontal</option><option value="1080,1920">1080 × 1920 — Story</option><option value="1080,1080">1080 × 1080
