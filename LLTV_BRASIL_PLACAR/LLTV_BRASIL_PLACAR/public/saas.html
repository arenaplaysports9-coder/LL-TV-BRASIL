<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LL TV BRASIL — Plataforma SaaS</title><link rel="stylesheet" href="/saas.css"></head><body><header><div><b>LL TV BRASIL</b><small>PLATAFORMA SAAS • WHITE LABEL</small></div><a href="/panel.html">Voltar ao Placar</a></header><main><section id="login" class="card hidden"><h1>Acesso da emissora</h1><p>Entre com as credenciais fornecidas pelo administrador.</p><form id="login-form"><label>E-mail<input id="login-email" type="email" required></label><label>Senha<input id="login-password" type="password" required></label><button>Entrar</button></form><p id="login-error" class="error"></p></section><section id="super" class="hidden"><h1>Super Admin <span>LL TV BRASIL</span></h1><div class="stats" id="stats"></div><div class="columns"><article class="card"><h2>Cadastrar emissora cliente</h2><form id="tenant-form"><label>Nome da emissora<input name="name" required></label><label>Nome do responsável<input name="ownerName"></label><label>E-mail de acesso<input name="email" type="email" required></label><label>Senha inicial (mínimo 10 caracteres)<input name="password" type="password" minlength="10" required></label><label>Plano<select name="planId" id="tenant-plan"></select></label><button>Criar cliente e acesso</button></form><p id="tenant-result"></p></article><article class="card"><h2>Planos e preços</h2><form id="plan-form"><label>Nome do plano<input name="name" required placeholder="PERSONALIZADO"></label><label>Valor (opcional — deixe vazio para proposta personalizada)<input name="price" type="number" min="0.01" step="0.01" placeholder="Sob consulta"></label><label>Limite de usuários<input name="users" type="number" min="1" value="5"></label><label>Horas mensais<input name="hours" type="number" min="1" value="30"></label><label>Armazenamento (MB)<input name="storage" type="number" min="1" value="5120"></label><button>Salvar plano</button></form><div id="plans"></div></article></div><article class="card"><h2>Emissoras cadastradas</h2><div class="table-wrap"><table><thead><tr><th>Emissora</th><th>Identificador</th><th>Plano</th><th>Status</th><th>Ação</th></tr></thead><tbody id="tenants"></tbody></table></div></article></section><section id="workspace" class="hidden"><div class="workspace-head"><div><h1 id="tenant-name">Painel da emissora</h1><p id="tenant-meta"></p></div><button id="logout" class="secondary">Sair</button></div><div class="tabs" id="tabs"><button data-kind="matches">Partidas</button><button data-kind="teams">Equipes</button><button data-kind="competitions">Competições</button><button data-kind="broadcasts">Transmissões</button><button data-kind="sponsors">Patrocinadores</button><button data-kind="media">Biblioteca</button></div><article class="card"><h2 id="collection-title">Partidas</h2><form id="record-form"><label>Nome / título<input name="name" required></label><label>Descrição / informações<textarea name="description" rows="3"></textarea></label><label>Data e horário<input name="date" type="datetime-local"></label><label>Imagem ou arquivo<input name="file" type="file"></label><button>Adicionar registro</button></form><div id="records" class="records"></div></article></section><p id="fatal" class="error"></p></main><script src="/saas.js"></script></body></html>
