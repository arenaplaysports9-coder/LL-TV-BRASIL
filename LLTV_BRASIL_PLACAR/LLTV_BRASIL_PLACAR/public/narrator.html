<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Monitor do Narrador — LLTV BRASIL"><link rel="stylesheet" href="/style.css"><style>body{background:#07101c;color:#fff}.narrator{max-width:1100px;margin:24px auto;padding:18px}.ncard{background:#132238;border:1px solid #30445f;border-radius:12px;padding:18px;margin:12px 0}.bigscore{display:flex;justify-content:space-around;align-items:center;font-size:clamp(32px,8vw,72px);font-weight:800}.team{text-align:center;font-size:clamp(16px,3vw,28px)}.meta{text-align:center;color:#c4d0df}.clock{text-align:center;font-size:36px;color:#ffcf62}.pill{float:right}</style></head><body><main class="narrator"><header><div class="brand">LLTV <span>BRASIL</span></div><h1>MONITOR DO NARRADOR</h1><span id="status" class="pill">Conectando…</span></header><section class="ncard"><div class="meta" id="competition"></div><div class="bigscore"><div class="team" id="home"></div><div id="score">0 × 0</div><div class="team" id="away"></div></div><div class="clock" id="clock">00:00</div><div class="meta" id="period"></div></section><section class="ncard"><h2>Informações da partida</h2><div id="matchinfo"></div></section><section class="ncard"><h2>Eventos e escalações</h2><div id="details"></div></section></main><script src="/narrator.js"></script></body></html>
