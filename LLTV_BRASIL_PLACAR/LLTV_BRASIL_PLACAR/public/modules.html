<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Módulos — LLTV BRASIL</title><link rel="stylesheet" href="/style.css"><style>
:root{--gold:#d7ad4b;--ink:#111;--panel:#1c1c1c}body{background:#101010;color:#f7f7f7;font-family:Arial,sans-serif;margin:0}.module-head{padding:18px 24px;background:#050505;border-bottom:2px solid var(--gold);display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.module-head h1{margin:0;color:var(--gold)}.module-layout{max-width:1450px;margin:auto;padding:20px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px}.module-nav,.module-card{background:#1b1b1b;border:1px solid #393939;border-radius:10px;padding:16px}.module-nav button{display:block;width:100%;text-align:left;margin:4px 0;background:#252525;color:white;border:1px solid #444;padding:10px;border-radius:6px;cursor:pointer}.module-nav button.active,.gold{background:#d7ad4b!important;color:#111!important;font-weight:bold}.module-card h2{margin-top:0}.module-card input,.module-card textarea,.module-card select{box-sizing:border-box;width:100%;padding:10px;background:#111;color:white;border:1px solid #555;border-radius:5px}.module-card textarea{min-height:180px;font-family:monospace}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{padding:10px 14px;border:0;border-radius:5px;background:#d7ad4b;color:#111;font-weight:bold;cursor:pointer;margin:5px 5px 5px 0}.btn.alt{background:#333;color:#fff;border:1px solid #555}.list{margin-top:18px;display:grid;gap:8px}.item{padding:12px;background:#111;border:1px solid #333;border-radius:6px;display:flex;justify-content:space-between;gap:12px;align-items:center}.item small{display:block;color:#aaa;overflow-wrap:anywhere}.notice{padding:10px;margin-top:10px;color:#f5d782}.help{color:#bbb;line-height:1.5}.overlay-links{display:flex;flex-wrap:wrap;gap:8px}.overlay-links a{color:#f5d782} @media(max-width:800px){.module-layout{grid-template-columns:1fr}.module-nav{display:grid;grid-template-columns:1fr 1fr;gap:5px}.row{grid-template-columns:1fr}}
</style></head><body><header class="module-head"><div><h1>LLTV BRASIL</h1><div>A CASA DAS LIGAS ALTERNATIVAS — Central de módulos</div></div><div><a class="button secondary" href="/panel.html">← Voltar ao placar</a></div></header><main class="module-layout"><nav class="module-nav" id="nav"></nav><section class="module-card"><h2 id="title">Gerenciamento</h2><p class="help" id="description">Cadastre, edite e organize os dados da operação.</p><div class="row"><label>Nome / título do registro<input id="recordTitle" placeholder="Ex.: Campeonato estadual"></label><label>Identificador relacionado (opcional)<input id="recordRelation" placeholder="ID da partida, equipe ou competição"></label></div><label style="display:block;margin-top:12px">Dados do módulo em JSON<textarea id="recordJson" spellcheck="false"></textarea></label><div><button class="btn" id="save">Salvar novo registro</button><button class="btn alt" id="cancel">Limpar formulário</button><button class="btn alt" id="export">Exportar backup</button><label class="btn alt" for="backupFile" style="display:inline-block">Restaurar backup</label><input id="backupFile" type="file" accept="application/json" hidden></div><div id="notice" class="notice" role="status"></div><h3>Registros salvos</h3><input id="filter" placeholder="Filtrar registros..." style="margin-bottom:10px"><div class="list" id="list"></div><h3>Overlays independentes para OBS</h3><div class="overlay-links" id="overlayLinks"></div></section></main><script src="/modules.js"></script></body></html>
