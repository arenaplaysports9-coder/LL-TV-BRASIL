<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de eventos — LLTV BRASIL</title><style>body{margin:0;background:#101010;color:#fff;font-family:Arial}.head{padding:18px;background:#050505;border-bottom:2px solid #d7ad4b;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.head h1{margin:0;color:#d7ad4b}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#1b1b1b;border:1px solid #444;border-radius:10px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.grid label{display:block;color:#ddd}.grid input,.grid select,.grid textarea{width:100%;box-sizing:border-box;padding:10px;margin-top:6px;background:#111;color:#fff;border:1px solid #555;border-radius:5px}.btn{padding:10px 14px;background:#d7ad4b;color:#111;font-weight:bold;border:0;border-radius:5px;cursor:pointer;margin:6px 6px 0 0}.btn.alt{background:#333;color:#fff}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#111;border:1px solid #333;border-radius:6px;padding:10px;margin-top:8px}.note{color:#e5c46e;white-space:pre-wrap}.muted{color:#aaa}</style></head><body><header class="head"><div><h1>Central de eventos da partida</h1><div>Gols · Cartões · Substituições · VAR · Períodos</div></div><a style="color:#e5c46e" href="/panel.html">← Voltar ao placar</a></header><main class="wrap"><section class="card"><h2>Novo evento</h2><div class="grid"><label>Tipo<select id="type"><option value="goal">Gol</option><option value="own_goal">Gol contra</option><option value="penalty_goal">Gol de pênalti</option><option value="yellow_card">Cartão amarelo</option><option value="second_yellow">Segundo amarelo</option><option value="red_card">Cartão vermelho</option><option value="substitution">Substituição</option><option value="var_review">Revisão de VAR</option><option value="medical">Atendimento médico</option><option value="period_start">Início de período</option><option value="period_end">Fim de período</option><option value="timeout">Tempo técnico</option><option value="penalty">Pênalti</option></select></label><label>Equipe<select id="teamSide"><option value="home">Mandante</option><option value="away">Visitante</option></select></label><label>ID da partida<input id="matchId" placeholder="ID cadastrado em Partidas"></label><label>ID da equipe (para escalação)<input id="teamId" placeholder="ID da equipe"></label><label>Minuto<input id="minute" type="number" min="0" max="200" value="0"></label><label>Acréscimo<input id="addedMinute" type="number" min="0" max="99" value="0"></label><label>Jogador envolvido<input id="playerName" placeholder="Nome do jogador"></label><label>Jogador que sai<select id="playerOutId"><option value="">Selecione jogador em campo</option></select></label><label>Jogador que entra<select id="playerInId"><option value="">Selecione reserva disponível</option></select></label><label>Descrição / observação<input id="description" placeholder="Detalhe opcional"></label></div><p class="muted">Para substituições automáticas, cadastre antes a escalação em “Escalações e banco”, com o mesmo ID da partida e ID da equipe. Use IDs de jogador únicos.</p><button class="btn" id="save">Confirmar evento</button><button class="btn alt" id="reload">Atualizar listas</button><div id="msg" class="note"></div></section><section class="card"><h2>Histórico de eventos</h2><div id="history"></div></section></main><script src="/events.js"></script></body></html>
