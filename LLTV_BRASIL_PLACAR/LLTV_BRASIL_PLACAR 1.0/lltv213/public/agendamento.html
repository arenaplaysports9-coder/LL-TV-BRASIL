<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Central de Agendamento — LLTV Brasil</title><link rel="stylesheet" href="/style.css"><style>
.ag-wrap{max-width:1250px;margin:24px auto;padding:0 16px}.ag-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:16px}.ag-card{background:#111b27;border:1px solid #29445e;border-radius:12px;padding:18px}.ag-card h2{margin-top:0}.ag-card label{display:block;margin:10px 0 5px}.ag-card input,.ag-card textarea,.ag-card select{width:100%;padding:10px;border-radius:7px;border:1px solid #456078;background:#07111b;color:#fff}.ag-card textarea{min-height:90px}.ag-btn{padding:10px 14px;border:0;border-radius:7px;background:#1769aa;color:white;cursor:pointer;margin:5px 4px 5px 0}.ag-btn.alt{background:#394b5d}.ag-status{font-size:12px;padding:4px 8px;border-radius:20px;background:#24394d}.ag-row{border-bottom:1px solid #33495c;padding:12px 0}.ag-cover{max-width:100%;max-height:150px;object-fit:contain}.ag-muted{color:#aab8c6;font-size:13px}.ag-check{display:inline-flex;align-items:center;gap:5px;margin-right:12px}.ag-check input{width:auto}.ag-platform{border:1px solid #30485d;border-radius:8px;padding:10px;margin:8px 0}.ag-actions{display:flex;flex-wrap:wrap;gap:5px}@media(max-width:600px){.ag-wrap{padding:0 8px}}
</style></head><body><main class="ag-wrap"><header class="ag-card"><div style="display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center"><div><h1>📅 CENTRAL DE AGENDAMENTO DE TRANSMISSÕES</h1><p class="ag-muted">Programação, integrações e acompanhamento multiplataforma — LL TV BRASIL</p></div><a class="button secondary" href="/panel.html">← Voltar ao Painel</a></div></header>
<section class="ag-grid" style="margin-top:16px"><article class="ag-card"><h2>🔐 Central de APIs e Integrações</h2><label>Plataforma</label><select id="provider"><option value="youtube">YouTube / Google</option><option value="facebook">Facebook / Meta</option><option value="instagram">Instagram / Meta</option><option value="tiktok">TikTok</option><option value="twitch">Twitch</option><option value="x">X (Twitter)</option><option value="linkedin">LinkedIn</option><option value="kick">Kick</option></select><label>Nome da integração</label><input id="integrationName" placeholder="Ex.: LLTV Oficial"><label>Client ID</label><input id="clientId"><label>Client Secret (deixe vazio para manter o atual)</label><input id="clientSecret" type="password"><label>App ID</label><input id="appId"><label>App Secret (deixe vazio para manter o atual)</label><input id="appSecret" type="password"><label>API Key (deixe vazio para manter o atual)</label><input id="apiKey" type="password"><label>Access Token (deixe vazio para manter o atual)</label><input id="accessToken" type="password"><label>Redirect URI</label><input id="redirectUri" placeholder="URL de callback cadastrada na plataforma"><label>Servidor RTMP</label><input id="rtmpUrl" placeholder="rtmp://..."><label>Chave RTMP (deixe vazio para manter a atual)</label><input id="streamKey" type="password"><div class="ag-actions"><button class="ag-btn" id="saveIntegration">Salvar credenciais</button><button class="ag-btn alt" id="testIntegration">Testar integração</button><button class="ag-btn alt" id="connectYoutube">Conectar Google / YouTube</button></div><div id="integrationStatus" class="ag-muted">As credenciais são armazenadas cifradas no servidor.</div><div id="accounts" class="ag-muted"></div></article>
<article class="ag-card"><h2>🎬 Novo agendamento</h2><label>Capa da transmissão</label><input id="cover" type="file" accept="image/png,image/jpeg,image/webp"><img id="coverPreview" class="ag-cover" hidden><label>Título *</label><input id="title" maxlength="200" placeholder="Ex.: União-TO x São Paulo"><label>Descrição</label><textarea id="description"></textarea><label>Tags (separadas por vírgula)</label><input id="tags" placeholder="futebol, ao vivo, LLTV Brasil"><label>Categoria</label><input id="category" value="Esportes"><label>Idioma</label><select id="language"><option value="pt-BR">Português (Brasil)</option><option value="en">English</option><option value="es">Español</option></select><label>Visibilidade</label><select id="visibility"><option value="public">Pública</option><option value="unlisted">Não listada</option><option value="private">Privada</option></select><label>Data e horário (Brasília)</label><input id="scheduledAt" type="datetime-local"><label>Fuso horário</label><select id="timezone"><option value="America/Sao_Paulo">Brasília — America/Sao_Paulo</option><option value="UTC">UTC</option></select><label>Destinos</label><div id="destinations"></div><label>Cena OBS (opcional)</label><input id="obsScene"><label>Perfil OBS (opcional)</label><input id="obsProfile"><div class="ag-actions"><button class="ag-btn" id="saveSchedule">Salvar agendamento</button><button class="ag-btn alt" id="saveDraft">Salvar rascunho</button></div><div id="scheduleStatus" class="ag-muted"></div></article></section>
<section class="ag-card" style="margin-top:16px"><h2>🗓️ Programação e gerenciamento</h2><div class="ag-actions"><button class="ag-btn alt" data-view="day">Dia</button><button class="ag-btn alt" data-view="week">Semana</button><button class="ag-btn alt" data-view="month">Mês</button><button class="ag-btn" id="refresh">Atualizar</button></div><div id="scheduleList">Carregando...</div></section></main><script src="/agendamento.js"></script></body></html>
