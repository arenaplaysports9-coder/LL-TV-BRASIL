worker_processes auto;
events { worker_connections 1024; }

rtmp {
  server {
    listen 1935;
    chunk_size 4096;
    application live {
      live on;
      record off;
      # Em produção, adicione autenticação on_publish e chaves individuais.
      hls on;
      hls_path /tmp/hls;
      hls_fragment 4s;
      hls_playlist_length 20s;
      hls_cleanup on;
    }
  }
}

http {
  server {
    listen 8080;
    location /hls {
      types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t ts;
      }
      root /tmp;
      add_header Cache-Control no-cache;
      add_header Access-Control-Allow-Origin *;
    }
    location /health { return 200 'streaming gateway ok'; }
  }
}
