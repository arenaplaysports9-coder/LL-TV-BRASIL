services:
  postgres:
    image: postgres:16-alpine
    container_name: lltv-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lltv
      POSTGRES_USER: lltv
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    ports:
      - "5432:5432"
    volumes:
      - lltv_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

  rtmp:
    image: alfg/nginx-rtmp
    container_name: lltv-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935"
      - "8080:8080"
    volumes:
      - ./streaming/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - lltv_hls:/tmp/hls

volumes:
  lltv_pgdata:
  lltv_hls:
